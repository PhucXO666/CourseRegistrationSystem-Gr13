<!-- templates/admin/_sidebar.html -->
<div class="card">
    <div class="card-header">
        <h6 class="mb-0">Quản lý Hệ thống</h6>
    </div>
    <div class="list-group list-group-flush">
        <a href="{{ url_for('admin.admin_dashboard') }}" 
           class="list-group-item list-group-item-action {% if request.endpoint == 'admin.admin_dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
        <a href="{{ url_for('admin.manage_students') }}" 
           class="list-group-item list-group-item-action {% if request.endpoint == 'admin.manage_students' %}active{% endif %}">
            <i class="bi bi-people-fill me-2"></i> Quản lý Sinh viên
        </a>
        <a href="{{ url_for('admin.manage_courses') }}" 
           class="list-group-item list-group-item-action {% if request.endpoint == 'admin.manage_courses' %}active{% endif %}">
            <i class="bi bi-book-fill me-2"></i> Quản lý Học phần
        </a>
        <a href="{{ url_for('admin.manage_classes') }}" 
           class="list-group-item list-group-item-action {% if request.endpoint == 'admin.manage_classes' %}active{% endif %}">
            <i class="bi bi-calendar-week-fill me-2"></i> Quản lý Lớp học
        </a>
        <a href="{{ url_for('admin.manage_registration_periods') }}" 
           class="list-group-item list-group-item-action {% if request.endpoint == 'admin.manage_registration_periods' %}active{% endif %}">
            <i class="bi bi-clock-fill me-2"></i> Đợt đăng ký
        </a>
        <a href="{{ url_for('admin.view_reports') }}" 
           class="list-group-item list-group-item-action {% if request.endpoint == 'admin.view_reports' %}active{% endif %}">
            <i class="bi bi-bar-chart-fill me-2"></i> Báo cáo & Thống kê
        </a>
    </div>
</div>

<!-- Quick Stats -->
<div class="card mt-3">
    <div class="card-header">
        <h6 class="mb-0">Thống kê nhanh</h6>
    </div>
    <div class="card-body">
        <div class="d-flex justify-content-between mb-2">
            <span>Sinh viên:</span>
            <span class="badge bg-primary">{{ total_students }}</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span>Lớp học:</span>
            <span class="badge bg-success">{{ total_classes }}</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span>Đợt đăng ký:</span>
            <span class="badge bg-info">{{ total_periods }}</span>
        </div>
    </div>
</div>
