<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">Thêm sinh viên mới</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="student_id" class="form-label">Mã sinh viên *</label>
                                    <input type="text" class="form-control" id="student_id" name="student_id" required>
                                    <div class="form-text">Sẽ được dùng làm username đăng nhập</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="full_name" class="form-label">Họ và tên *</label>
                                    <input type="text" class="form-control" id="full_name" name="full_name" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="date_of_birth" class="form-label">Ngày sinh</label>
                                    <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="major" class="form-label">Ngành học</label>
                                    <input type="text" class="form-control" id="major" name="major">
                                </div>
                                <div class="col-md-6">
                                    <label for="enrollment_year" class="form-label">Năm nhập học *</label>
                                    <select class="form-control" id="enrollment_year" name="enrollment_year" required>
                                        {% for year in range(2020, 2025) %}
                                        <option value="{{ year }}" {% if year == 2023 %}selected{% endif %}>{{ year }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="alert alert-info">
                                <strong>Lưu ý:</strong> Mật khẩu mặc định sẽ là "password123"
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{{ url_for('admin.manage_students') }}" class="btn btn-secondary">Quay lại</a>
                                <button type="submit" class="btn btn-primary">Thêm sinh viên</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
